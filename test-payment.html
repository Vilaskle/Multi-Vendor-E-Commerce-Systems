<!DOCTYPE html>
<html>
  <head>
    <title>Razorpay Test</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body>
    <h2>Razorpay Test Checkout</h2>
    <button onclick="pay()">Pay Now</button>

    <script>
      function pay() {
        const options = {
          key: "rzp_test_SJrEp6I2KqLOJq", // YOUR TEST KEY ID
          amount: 43800,           // from create-payment response
          currency: "INR",
          order_id: "order_SlyUmxYt8CtJts", // from create-payment response

          handler: function (response) {
            console.log("PAYMENT SUCCESS", response);
            alert("Payment successful. Check console.");
          },
        };

        const rzp = new Razorpay(options);
        rzp.open();
      }
    </script>
  </body>
</html>
